name: 全功能测试

on:
  push:
    branches: [master, main, '3.3', 'fix/**', 'feature/**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    env:
      SECRET_KEY: ci-test-secret-key-for-github-actions-only
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r judicial-system/backend/requirements.txt
          pip install pytest httpx

      - name: 运行单元测试
        working-directory: judicial-system/backend
        run: python -m pytest tests/test_auth.py tests/test_persons.py tests/test_visits.py tests/test_reminders.py tests/test_validation.py tests/test_expiring_filter.py -v --tb=short

      - name: 启动服务并运行 API 集成测试
        shell: python
        env:
          SECRET_KEY: ci-test-secret-key-for-github-actions-only
        run: |
          import subprocess, time, httpx, sys, json
          from datetime import date, timedelta

          proc = subprocess.Popen(
            [sys.executable, "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"],
            cwd="judicial-system/backend"
          )
          time.sleep(5)

          P, F, results = 0, 0, []

          def calc_check(d17):
            w=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2]
            return "10X98765432"[sum(int(d17[i])*w[i] for i in range(17))%11]

          def test(name, func):
            global P, F
            try:
              r = func(); P += 1; results.append(f"PASS {name}: {r}")
            except Exception as e:
              F += 1; results.append(f"FAIL {name}: {e}")

          c = httpx.Client(base_url="http://127.0.0.1:8000", timeout=15)

          # 登录（使用real_name登录）
          r = c.post("/api/auth/login", json={"real_name":"系统管理员","password":"admin123"})
          TOKEN = r.json()["data"]["access_token"]
          H = {"Authorization": f"Bearer {TOKEN}"}

          today = date.today()

          # 辅助函数
          def get(path):
            r = c.get(path, headers=H); return r.json().get("data") or r.json()
          def post(path, body={}):
            return c.post(path, json=body, headers=H).json()

          # 生成有效身份证
          def id_card(seq):
            y=1970+(seq%40); m=1+(seq%12); d=1+(seq%28)
            d17=f"320102{y}{m:02d}{d:02d}{seq:03d}"[:17]
            return d17+calc_check(d17)

          # 创建测试数据
          test_data = [
            {"name":"A_5days","status":"在帮","risk_level":"高","edu_end_date":(today+timedelta(days=5)).isoformat(),"is_minor":False},
            {"name":"B_15days","status":"在帮","risk_level":"中","edu_end_date":(today+timedelta(days=15)).isoformat(),"is_minor":True},
            {"name":"C_25days","status":"在帮","risk_level":"低","edu_end_date":(today+timedelta(days=25)).isoformat(),"is_xj":True},
            {"name":"D_overdue","status":"在帮","risk_level":"高","edu_end_date":(today-timedelta(days=10)).isoformat(),"is_mental":True},
            {"name":"E_normal90","status":"在帮","risk_level":"低","edu_end_date":(today+timedelta(days=90)).isoformat()},
            {"name":"F_released","status":"已解除","risk_level":"低","edu_end_date":(today+timedelta(days=3)).isoformat()},
            {"name":"G_minor_mental","status":"在帮","risk_level":"高","edu_end_date":(today+timedelta(days=10)).isoformat(),"is_minor":True,"is_mental":True},
          ]
          ids = []
          for i, d in enumerate(test_data):
            d["id_card"] = id_card(i+100)
            r = c.post("/api/persons", json=d, headers=H)
            rd = r.json()
            if rd.get("code") == 0:
              ids.append(rd["data"]["id"])
            else:
              r2 = c.get(f"/api/persons?search={d['name']}", headers=H)
              items = (r2.json().get("data") or r2.json()).get("items",[])
              if items: ids.append(items[0]["id"])

          # === Basic ===
          test("Login", lambda: "OK")
          test("UserInfo", lambda: f"ok={get('/api/auth/me') is not None}")
          test("PersonList", lambda: f"total={get('/api/persons?page_size=20')['total']}")
          test("Search", lambda: f"found={get('/api/persons?search=A_5days')['total']}")
          test("PersonDetail", lambda: f"id={get('/api/persons/'+str(ids[0]))['id']}")
          test("UpdatePerson", lambda: f"code={c.patch('/api/persons/'+str(ids[0]), json={'risk_level':'中'}, headers=H).json().get('code',0)}")
          test("EditHistory", lambda: f"{len(get('/api/persons/'+str(ids[0])+'/edit-logs'))} entries")
          test("StatsSummary", lambda: f"total={get('/api/persons/stats-summary')['total']}")
          test("QuarterlyReport", lambda: f"year={get('/api/persons/reports-quarterly').get('year','?')}")
          test("ExcelExport", lambda: f"{len(c.get('/api/persons/export', headers=H).content)}bytes")

          # === Expiring list ===
          def t_expiring_list():
            d = c.get("/api/reminders", headers=H).json()
            data = d.get("data") or d
            assert "expiring_list" in data
            assert len(data["expiring_list"]) > 0
            return f"{len(data['expiring_list'])} persons"
          test("ExpiringList", t_expiring_list)

          def t_expiring_contains():
            d = (c.get("/api/reminders", headers=H).json().get("data") or {})
            names = [p["name"] for p in d.get("expiring_list",[])]
            assert "A_5days" in names
            assert "F_released" not in names
            return "OK"
          test("ExpiringFilter", t_expiring_contains)

          def t_overdue_list():
            d = (c.get("/api/reminders", headers=H).json().get("data") or {})
            assert "visit_overdue_list" in d
            return f"{len(d['visit_overdue_list'])} persons"
          test("OverdueVisits", t_overdue_list)

          # === Expiring filter ===
          def t_7d():
            d = get("/api/persons?expiring_within_days=7")
            names = [p["name"] for p in d.get("items",[])]
            assert "A_5days" in names and "B_15days" not in names
            return f"{d.get('total',0)} persons"
          test("Filter7d", t_7d)

          def t_30d():
            d = get("/api/persons?expiring_within_days=30")
            names = [p["name"] for p in d.get("items",[])]
            assert "A_5days" in names and "B_15days" in names
            return f"{d.get('total',0)} persons"
          test("Filter30d", t_30d)

          def t_30d_active():
            d = get("/api/persons?expiring_within_days=30")
            for p in d.get("items",[]): assert p["status"]=="在帮"
            return "OK"
          test("Filter30dActiveOnly", t_30d_active)

          # === Combo filter ===
          def t_combo1():
            d = get("/api/persons?is_minor=true&is_mental=true")
            names = [p["name"] for p in d.get("items",[])]
            assert "G_minor_mental" in names
            return f"{d.get('total',0)} persons"
          test("FilterMinor+Mental", t_combo1)

          def t_combo2():
            d = get("/api/persons?expiring_within_days=30&is_minor=true")
            names = [p["name"] for p in d.get("items",[])]
            assert "B_15days" in names
            return f"{d.get('total',0)} persons"
          test("Filter30d+Minor", t_combo2)

          def t_xj():
            d = get("/api/persons?is_xj=true")
            names = [p["name"] for p in d.get("items",[])]
            assert "C_25days" in names
            return f"{d.get('total',0)} persons"
          test("FilterXJ", t_xj)

          # === New APIs ===
          def t_trend():
            d = get("/api/persons/stats-trend?months=3")
            assert isinstance(d, list) and len(d) > 0
            return f"{len(d)} months"
          test("StatsTrend", t_trend)

          def t_risk():
            d = get(f"/api/persons/{ids[0]}/risk-score")
            assert "score" in d and "level" in d
            return f"score={d['score']}, level={d['level']}"
          test("RiskScore", t_risk)

          def t_batch_del():
            r = post("/api/persons/batch-delete", {"ids":[ids[-1]]})
            assert r.get("code") == 0
            return r.get("message","ok")
          test("BatchDelete", t_batch_del)

          def t_batch_status():
            r = post("/api/persons/batch-update-status", {"ids":[ids[0]],"status":"脱管"})
            assert r.get("code") == 0
            return r.get("message","ok")
          test("BatchUpdateStatus", t_batch_status)

          def t_batch_risk():
            r = post("/api/persons/batch-update-risk", {"ids":[ids[1]],"risk_level":"高"})
            assert r.get("code") == 0
            return r.get("message","ok")
          test("BatchUpdateRisk", t_batch_risk)

          # === Visits ===
          def t_visit():
            r = post("/api/visits", {"person_id":ids[2],"visit_date":str(today),"visitor":"CI Test","visit_method":"上门"})
            return f"code={r.get('code','?')}"
          test("CreateVisit", t_visit)

          test("VisitList", lambda: f"total={get('/api/visits?page_size=100')['total']}")
          test("VisitStats", lambda: f"total={get('/api/visits/stats-quarterly').get('total',0)}")
          test("ChangePassword", lambda: f"code={post('/api/auth/change-password', {'old_password':'admin123','new_password':'admin123'}).get('code',0)}")

          proc.terminate()

          print()
          print("=" * 60)
          print(f"  PASSED: {P}  FAILED: {F}  TOTAL: {P+F}")
          print("=" * 60)
          for r in results: print(f"  {r}")
          if F > 0:
            print(f"\n  FAILED {F} tests")
            sys.exit(1)
          else:
            print(f"\n  ALL PASSED")

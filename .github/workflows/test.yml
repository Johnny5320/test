name: 全功能测试

on:
  push:
    branches: [master, main, '3.3', 'fix/**', 'feature/**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    env:
      SECRET_KEY: ci-test-secret-key-for-github-actions-only
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r judicial-system/backend/requirements.txt
          pip install pytest httpx

      - name: 运行单元测试
        working-directory: judicial-system/backend
        run: python -m pytest tests/test_auth.py tests/test_persons.py tests/test_visits.py tests/test_reminders.py tests/test_validation.py tests/test_expiring_filter.py -v --tb=short

      - name: 启动服务并运行 API 集成测试
        shell: pwsh
        env:
          SECRET_KEY: ci-test-secret-key-for-github-actions-only
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          python -X utf8 ci_integration_test.py
        continue-on-error: true
        id: integration

      - name: Print server logs on failure
        if: always()
        shell: pwsh
        run: |
          if (Test-Path server_stderr.log) { Write-Host "=== SERVER STDERR ==="; Get-Content server_stderr.log -Tail 100 }
          if (Test-Path server_stdout.log) { Write-Host "=== SERVER STDOUT ==="; Get-Content server_stdout.log -Tail 50 }

      - name: Fail if integration test failed
        if: steps.integration.outcome == 'failure'
        run: exit 1
